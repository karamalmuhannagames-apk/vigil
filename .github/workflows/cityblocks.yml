name: Render city blocks

on:
  push:
    branches: [main]
    paths: ['ci/render/cityblocks.py', '.github/workflows/cityblocks.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        region: [gulf, europe, asia, americas]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender (free, from blender.org) and the free CC0 sky
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libxrender1 libgl1 libsm6 libxxf86vm1 libxfixes3 > /dev/null
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar xf b.tar.xz && mv blender-4.2.3-linux-x64 blender
          mkdir -p tex && curl -sSfL -o tex/sky.hdr https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/kloofendal_48d_partly_cloudy_puresky_2k.hdr || true
      - name: Render ${{ matrix.region }} city blocks
        env:
          REGIONS: ${{ matrix.region }}
        run: |
          ./blender/blender -b -P ci/render/cityblocks.py -- out > b.log 2>&1 || true
          grep -E "rendered|Error|Traceback|line " b.log | tail -60
          if grep -q Traceback b.log; then exit 1; fi
          ls out | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: blocks-${{ matrix.region }}
          path: out

  save:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: blocks-*
          path: art/cityblocks
          merge-multiple: true
      - name: Save
        run: |
          git config user.name "vigil-art"
          git config user.email "noreply@github.com"
          git add art/cityblocks
          git diff --cached --quiet || (git commit -m "Art: city blocks per region" && git pull --rebase -X theirs origin main && git push)
