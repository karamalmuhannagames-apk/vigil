name: Render city buildings

on:
  push:
    branches: [main]
    paths: ['ci/render/buildings.py', '.github/workflows/buildings.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        region: [gulf, europe, asia, americas]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender (free, from blender.org) and the free CC0 sky
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libxrender1 libgl1 libsm6 libxxf86vm1 libxfixes3 > /dev/null
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar xf b.tar.xz && mv blender-4.2.3-linux-x64 blender
          mkdir -p tex && curl -sSfL -o tex/sky.hdr https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/kloofendal_48d_partly_cloudy_puresky_2k.hdr || true
      - name: Render ${{ matrix.region }} buildings, every level
        env:
          REGIONS: ${{ matrix.region }}
        run: |
          ./blender/blender -b -P ci/render/buildings.py -- art/buildings > b.log 2>&1 || true
          grep -E "rendered|Error|Traceback|line " b.log | tail -60
          if grep -q Traceback b.log; then exit 1; fi
          ls art/buildings | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: buildings-${{ matrix.region }}
          path: art/buildings

  save:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: buildings-*
          path: art/buildings
          merge-multiple: true
      - name: Make a contact sheet and save
        run: |
          pip install -q pillow
          python3 - <<'EOF'
          from PIL import Image
          import os, glob
          regs = ['gulf', 'europe', 'asia', 'americas']
          types = ['training_camp', 'factory', 'airport', 'port', 'industry', 'hospital', 'bunker']
          T = 192
          for r in regs:
              sheet = Image.new('RGBA', (T * 5, T * len(types)), (70, 82, 64, 255))
              for i, t in enumerate(types):
                  for L in range(1, 6):
                      f = f'art/buildings/{t}_{r}_{L}.png'
                      if os.path.exists(f):
                          im = Image.open(f).convert('RGBA').resize((T, T), Image.LANCZOS)
                          sheet.alpha_composite(im, ((L - 1) * T, i * T))
              sheet.convert('RGB').save(f'art/buildings/sheet_{r}.jpg', quality=90)
          EOF
          git config user.name "vigil-art"
          git config user.email "noreply@github.com"
          git add art/buildings
          git diff --cached --quiet || (git commit -m "Art: city buildings, 4 regions x 5 levels" && git pull --rebase origin main && git push)
