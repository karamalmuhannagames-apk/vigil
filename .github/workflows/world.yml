name: Build real world map

on:
  push:
    branches: [main]
    paths: ['ci/world/**', '.github/workflows/world.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: pip install -q numpy scipy pillow pyproj
      - name: Download free public-domain data (Natural Earth, NASA Blue Marble)
        run: |
          mkdir -p data && cd data
          NE=https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson
          for f in ne_10m_admin_0_countries_pse ne_10m_admin_0_countries ne_10m_admin_1_states_provinces ne_10m_populated_places ne_10m_lakes ne_10m_rivers_lake_centerlines; do
            curl -sSfL -o $f.geojson $NE/$f.geojson && echo "got $f" || echo "missing $f"
          done
          for u in \
            https://eoimages.gsfc.nasa.gov/images/imagerecords/73000/73909/world.topo.bathy.200412.3x21600x10800.jpg \
            https://eoimages.gsfc.nasa.gov/images/imagerecords/74000/74393/world.topo.200407.3x21600x10800.jpg \
            https://eoimages.gsfc.nasa.gov/images/imagerecords/73000/73751/world.topo.bathy.200407.3x21600x10800.jpg \
            https://eoimages.gsfc.nasa.gov/images/imagerecords/73000/73909/world.topo.bathy.200412.3x5400x2700.jpg ; do
            if curl -sSfL -o world.sat.jpg "$u"; then echo "satellite: $u"; break; fi
          done
          ls -la
      - name: Build the map
        run: W=8192 python3 ci/world/build.py data art/world
      - name: Save
        run: |
          ls -la art/world
          git config user.name "vigil-art"
          git config user.email "noreply@github.com"
          rm -f art/world/preview.jpg
          git add art/world
          git diff --cached --quiet || (git commit -m "World: real map build" && git pull --rebase origin main && git push)
