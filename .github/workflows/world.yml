name: Build real world map

on:
  push:
    branches: [main]
    paths: ['ci/world/**', '.github/workflows/world.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: pip install -q numpy scipy pillow pyproj scikit-image
      - name: Download free public-domain data (Natural Earth, NASA Blue Marble)
        run: |
          mkdir -p data && cd data
          NE=https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson
          for f in ne_10m_admin_0_countries_pse ne_10m_admin_0_countries ne_10m_admin_1_states_provinces ne_10m_populated_places ne_10m_lakes ne_10m_rivers_lake_centerlines; do
            curl -sSfL -o $f.geojson $NE/$f.geojson && echo "got $f" || echo "missing $f"
          done
          cd .. && python3 ci/world/fetch_sat.py data/world.sat.jpg || echo "satellite download failed"
          python3 ci/world/fetch_dem.py data/world.relief.jpg || echo "relief download failed"
          cd data
          ls -la
      - name: Build the map
        run: rm -rf art/world/tiles && W=8192 python3 ci/world/build.py data art/world
      - name: Save
        run: |
          ls -la art/world
          git config user.name "vigil-art"
          git config user.email "noreply@github.com"
          rm -f art/world/preview.jpg
          git add art/world
          git diff --cached --quiet || (git commit -m "World: real map build" && git pull --rebase origin main && git push)
