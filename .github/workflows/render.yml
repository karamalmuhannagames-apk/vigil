name: Render 3D icons

on:
  push:
    branches: [main]
    paths: ['ci/render/**', '.github/workflows/render.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender (free, from blender.org)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libxrender1 libgl1 libsm6 libxxf86vm1 libxfixes3 > /dev/null
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar xf b.tar.xz && mv blender-4.2.3-linux-x64 blender
      - name: Fetch free CC0 sky and scanned textures (Poly Haven, ambientCG)
        run: |
          mkdir -p tex/metal
          curl -sSfL -o tex/sky.hdr https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/kloofendal_48d_partly_cloudy_puresky_2k.hdr || echo "sky download failed"
          for id in PaintedMetal006 PaintedMetal009 PaintedMetal004; do
            if curl -sSfL -o m.zip "https://ambientcg.com/get?file=${id}_1K-JPG.zip"; then unzip -oq m.zip -d tex/metal && break; fi
          done
          ls -la tex tex/metal || true
          echo "Poly Haven kloofendal_48d_partly_cloudy_puresky (CC0); ambientCG painted metal (CC0)" > tex/LICENSES.txt
      - name: Render vehicles and cities
        run: |
          rm -f art/render/*.png
          ./blender/blender -b -P ci/render/units.py -- art/render > blender.log 2>&1 || true
          grep -E "rendered|Error|Traceback|line " blender.log || true
          if grep -q Traceback blender.log; then exit 1; fi
          ./blender/blender -b -P ci/render/city_tex.py -- art/citytex > city.log 2>&1 || true
          grep -E "rendered|Traceback|Error" city.log || true
      - name: Check output
        run: ls -la art/render && test $(ls art/render/*.png | wc -l) -ge 8 && ls art/citytex
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: art/render
      - name: Save to repository
        run: |
          git config user.name "vigil-art"
          git config user.email "noreply@github.com"
          git add art/render art/citytex
          git diff --cached --quiet || (git commit -m "Art: 3D icon renders" && git pull --rebase origin main && git push)
