name: Generate art

on:
  push:
    branches: [main]
    paths: ['ci/art/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public-domain photographs and cut them out
        run: |
          pip install -q "rembg[cpu]" pillow
          python3 ci/art/photos.py
      - name: Save them to the repository
        run: |
          git config user.name "vigil-art"
          git config user.email "noreply@github.com"
          git add art || true
          git diff --cached --quiet || (git commit -m "Art: new generated images" && git pull --rebase origin main && git push)
