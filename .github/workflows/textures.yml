name: Render map ground textures

on:
  push:
    branches: [main]
    paths: ['ci/render/forest.py', '.github/workflows/textures.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender (free, from blender.org)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libxrender1 libgl1 libsm6 libxxf86vm1 libxfixes3 > /dev/null
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar xf b.tar.xz && mv blender-4.2.3-linux-x64 blender
      - name: Render forest
        run: |
          ./blender/blender -b -P ci/render/forest.py -- out > b.log 2>&1 || true
          grep -E "trees|rendered|Error|Traceback|line " b.log | tail -40
          if grep -q Traceback b.log; then exit 1; fi
          mkdir -p app/world/tex && cp out/*.png app/world/tex/
      - name: Save
        run: |
          git config user.name "vigil-art"
          git config user.email "noreply@github.com"
          git add app/world/tex
          git diff --cached --quiet || (git commit -m "Art: forest ground texture [skip ci]" && git pull --rebase -X theirs origin main && git push)
