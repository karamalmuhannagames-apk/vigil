name: Render city miniatures

on:
  push:
    branches: [main]
    paths: ["ci/render/citymarks.py", ".github/workflows/citymarks.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        region: [gulf, europe, asia, americas]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender (free, from blender.org)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libxrender1 libgl1 libsm6 libxxf86vm1 libxfixes3 > /dev/null
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar xf b.tar.xz && mv blender-4.2.3-linux-x64 blender
      - name: Render city miniatures
        run: |
          REGIONS=${{ matrix.region }} SAMPLES=40 ./blender/blender -b -P ci/render/citymarks.py -- out > b.log 2>&1 || true
          grep -E "rendered|Error|Traceback|line " b.log | tail -40
          if grep -q Traceback b.log; then exit 1; fi
          mkdir -p art/citymarks && cp out/*.png art/citymarks/
      - name: Save
        run: |
          git config user.name "vigil-art"
          git config user.email "noreply@github.com"
          git add art/citymarks
          git diff --cached --quiet || (git commit -m "Art: city patches ${{ matrix.region }} [skip ci]" && for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep $((RANDOM % 20 + 5)); done)
