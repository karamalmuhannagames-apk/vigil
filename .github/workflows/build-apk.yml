name: Build Commander APK

on:
  # manual for now: the app is being rebuilt around the real world map; runs when a build is wanted
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the automatic tests
        run: npm test

      - name: Signing key (from a secret if set, otherwise a throwaway test key)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
          else keytool -genkeypair -keystore android/release.keystore -storepass android -keypass android -alias commander -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Halberd Studio Test, O=Halberd Studio" -noprompt; fi

      - name: Copy the game into the Android app
        run: |
          A=android/app/src/main/assets; mkdir -p $A/art/world $A/art/citymarks
          cp -r app core $A/
          rm -rf $A/app/fonts/compare.html $A/app/index.html $A/app/main.js $A/app/render.js $A/app/style.css $A/app/i18n.js $A/app/map $A/app/art
          cp art/world/world.json art/world/borders.json art/world/province_lines.json $A/art/world/
          cp -r art/world/tiles $A/art/world/
          cp art/citymarks/*.png $A/art/citymarks/
          du -sh $A

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build the signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "commander-${{ github.run_number }}.apk"
          gh release create "build-${{ github.run_number }}" "commander-${{ github.run_number }}.apk" \
            --title "Commander build ${{ github.run_number }}" --notes "Automatic build from $(git rev-parse --short HEAD)." --latest

      - uses: actions/upload-artifact@v4
        with:
          name: commander-apk
          path: commander-*.apk
