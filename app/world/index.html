<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World map prototype</title>
<style>
  @font-face{font-family:Alexandria;src:url(../fonts/Alexandria.ttf);font-weight:100 900}
  html,body{margin:0;height:100%;background:#0d1b26;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #hud{position:fixed;left:12px;bottom:12px;color:#cfe3d4;font:600 13px system-ui;background:#0d1b26cc;padding:6px 10px;border-radius:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
// Real-world map, tiled: only the tiles on screen are loaded and coloured, so it stays fast on a phone.
// Each tile = satellite colour + a country-id image. Colour by relation is applied per tile, live,
// so declaring war or giving passage recolours the map instantly.
const DATA = new URLSearchParams(location.search).get('data') || '../../art/world/';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const T = 512;
let W, H, world, countries = [], byIso = {}, cityOrder = [];
const COL = {
  me:      {c: [0.28, 0.54, 0.20], a: 0.64},
  ally:    {c: [0.52, 0.70, 0.44], a: 0.62},
  passage: {c: [0.11, 0.28, 0.13], a: 0.80},
  neutral: {c: [0.21, 0.27, 0.35], a: 0.78},   // strangers: blue-grey slate like CoN
  enemy:   {c: [0.34, 0.035, 0.05], a: 0.84},
};
let ME = 'JOR';
let REL = {SAU: 'ally', EGY: 'ally', IRQ: 'passage', IRN: 'enemy'};   // everyone else: neutral (dark slate)
const relOf = i => { const iso = countries[i]?.iso; return iso === ME ? 'me' : (REL[iso] || 'neutral'); };
let view = {x: 0, y: 0, z: 1};
const cache = new Map();   // key z/x/y -> {canvas} ; tinted tiles
let gen = 0;               // bumps when relations change: tinted tiles rebuilt

function load(src) { return new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = src; }); }

async function buildTile(z, tx, ty) {
  const [sat, nat] = await Promise.all([load(`${DATA}tiles/${z}/${tx}_${ty}.jpg`), load(`${DATA}tiles/${z}/${tx}_${ty}_n.png`)]);
  const w = sat.width, h = sat.height;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', {willReadFrequently: true});
  g.drawImage(nat, 0, 0); const nd = g.getImageData(0, 0, w, h).data;
  g.drawImage(sat, 0, 0); const id = g.getImageData(0, 0, w, h), d = id.data;
  const nid = new Int16Array(w * h);
  for (let p = 0; p < w * h; p++) nid[p] = nd[p * 4] + nd[p * 4 + 1] * 256 - 1;
  const lut = {};
  for (let p = 0, q = 0; p < w * h; p++, q += 4) {
    const n = nid[p]; if (n < 0) continue;
    const s = lut[n] || (lut[n] = COL[relOf(n)]);
    // brightness kept but squeezed, so bright deserts and dark forests take the same colour family
    const L = Math.min(1.35, Math.max(0.6, 0.45 + 0.55 * (0.3 * d[q] + 0.59 * d[q + 1] + 0.11 * d[q + 2]) / 255 / 0.36));
    const a = s.a, cc = s.c;
    d[q] = d[q] * (1 - a) + Math.min(255, cc[0] * L * 255) * a;
    d[q + 1] = d[q + 1] * (1 - a) + Math.min(255, cc[1] * L * 255) * a;
    d[q + 2] = d[q + 2] * (1 - a) + Math.min(255, cc[2] * L * 255) * a;
  }
  g.putImageData(id, 0, 0);
  return c;
}

function tileFor(z, tx, ty) {
  const k = `${gen}/${z}/${tx}/${ty}`;
  let e = cache.get(k);
  if (!e) {
    e = {canvas: null}; cache.set(k, e);
    buildTile(z, tx, ty).then(c => { e.canvas = c; draw(); }, () => { e.failed = true; });
    if (cache.size > 220) { const old = cache.keys().next().value; cache.delete(old); }
  }
  return e.canvas;
}

const smooth = (a, b, v) => Math.min(1, Math.max(0, (v - a) / (b - a)));
function draw() {
  if (!world) return;
  const dpr = devicePixelRatio, sw = cv.width, sh = cv.height, s = view.z * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#10283a'; ctx.fillRect(0, 0, sw, sh);
  // zoom level: full resolution (3) when close, coarser tiles when far
  const z = Math.max(0, Math.min(3, Math.round(3 + Math.log2(view.z))));
  const f = 2 ** (3 - z);                     // world px per tile px
  const x0 = view.x - sw / 2 / s, y0 = view.y - sh / 2 / s, x1 = view.x + sw / 2 / s, y1 = view.y + sh / 2 / s;
  ctx.imageSmoothingQuality = 'high';
  for (let ty = Math.max(0, Math.floor(y0 / (T * f))); ty * T * f < Math.min(H, y1); ty++)
    for (let tx = Math.max(0, Math.floor(x0 / (T * f))); tx * T * f < Math.min(W, x1); tx++) {
      let c = tileFor(z, tx, ty), zz = z, ox = 0, oy = 0, sc = 1;
      // while a sharp tile loads, show the coarser parent so the map never has holes
      if (!c && z > 0) { const p = cache.get(`${gen}/${z - 1}/${tx >> 1}/${ty >> 1}`); if (p?.canvas) { c = p.canvas; zz = z - 1; ox = (tx & 1) * T / 2; oy = (ty & 1) * T / 2; sc = 2; } }
      if (!c) continue;
      const wx = tx * T * f, wy = ty * T * f;
      const px = (wx - view.x) * s + sw / 2, py = (wy - view.y) * s + sh / 2;
      if (sc === 1) ctx.drawImage(c, px, py, c.width * f * s, c.height * f * s);
      else ctx.drawImage(c, ox, oy, T / 2, T / 2, px, py, T * f * s, T * f * s);
    }
  drawBorders(s, sw, sh);
  // cities: most important first; a label that would overlap one already placed is skipped (no clutter, ever)
  ctx.textAlign = 'center';
  const placed = [];
  for (const p of cityOrder) {
    // when names appear: big playable capitals first, small and computer-run countries only closer in
    const big = p.area >= 300000;
    const capAt = p.cls === 'neutral' ? 1.2 : p.cls === 'ai' ? 0.7 : big ? 0.12 : 0.3;
    const show = p.kind === 'capital' ? smooth(capAt, capAt * 1.5, view.z) : p.kind === 'major' ? smooth(0.55, 0.8, view.z) : smooth(1.1, 1.5, view.z);
    if (!show) continue;
    const sx = (p.x - view.x) * s + sw / 2, sy = (p.y - view.y) * s + sh / 2;
    if (sx < -100 || sy < -50 || sx > sw + 100 || sy > sh + 50) continue;
    const fs0 = (p.kind === 'capital' ? 14 : 12) * dpr;
    ctx.font = `${p.kind === 'capital' ? 700 : 600} ${fs0}px Alexandria, system-ui`;
    const tw = ctx.measureText(p.name_ar).width, box = [sx - tw / 2 - 4 * dpr, sy - fs0 - 10 * dpr, sx + tw / 2 + 4 * dpr, sy + 5 * dpr];
    // a phone screen is small: keep generous breathing room around every name
    const pad = 14 * dpr;
    if (placed.some(b => box[0] - pad < b[2] && box[2] + pad > b[0] && box[1] - pad < b[3] && box[3] + pad > b[1])) continue;
    placed.push(box);
    ctx.globalAlpha = show;
    const r = (p.kind === 'capital' ? 4 : 3) * dpr;
    ctx.fillStyle = p.kind === 'capital' ? '#ffd34d' : '#f4f6f2'; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = dpr;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill(); ctx.stroke();
    const fs = (p.kind === 'capital' ? 14 : 12) * dpr;
    ctx.font = `${p.kind === 'capital' ? 700 : 600} ${fs}px Alexandria, system-ui`; ctx.lineWidth = 3 * dpr; ctx.strokeStyle = 'rgba(0,0,0,.6)';
    ctx.strokeText(p.name_ar, sx, sy - r - 4 * dpr); ctx.fillStyle = '#f4f6f2'; ctx.fillText(p.name_ar, sx, sy - r - 4 * dpr);
  }
  ctx.globalAlpha = 1;
  document.getElementById('hud').textContent = `zoom ${view.z.toFixed(2)} · tiles z${z}`;
}

// smooth vector borders, styled by relation: none with allies, dashed for passage, solid for strangers, red for enemies
let borders = [];
function borderKind(a, b) {
  const ia = countries[a]?.iso, ib = countries[b]?.iso;
  if (ia !== ME && ib !== ME) return 'foreign';
  return relOf(ia === ME ? b : a);
}
function drawBorders(s, sw, sh) {
  const dpr = devicePixelRatio;
  const x0 = view.x - sw / 2 / s, x1 = view.x + sw / 2 / s, y0 = view.y - sh / 2 / s, y1 = view.y + sh / 2 / s;
  const groups = {foreign: [], neutral: [], passage: [], enemy: []};
  for (const b of borders) {
    if (b.bb[2] < x0 || b.bb[0] > x1 || b.bb[3] < y0 || b.bb[1] > y1) continue;
    const k = borderKind(b.a, b.b); if (k === 'ally' || k === 'me') continue;
    (groups[k] || groups.neutral).push(b);
  }
  const path = list => { ctx.beginPath(); for (const b of list) { const p = b.p; ctx.moveTo((p[0] - view.x) * s + sw / 2, (p[1] - view.y) * s + sh / 2); for (let i = 2; i < p.length; i += 2) ctx.lineTo((p[i] - view.x) * s + sw / 2, (p[i + 1] - view.y) * s + sh / 2); } };
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const thin = Math.min(1, 0.6 + view.z * 0.5);
  path(groups.foreign); ctx.strokeStyle = 'rgba(235,240,245,0.45)'; ctx.lineWidth = 1 * dpr * thin; ctx.stroke();
  path(groups.neutral); ctx.strokeStyle = 'rgba(245,247,250,0.9)'; ctx.lineWidth = 1.5 * dpr * thin; ctx.stroke();
  path(groups.passage); ctx.setLineDash([5 * dpr, 4 * dpr]); ctx.strokeStyle = 'rgba(245,247,250,0.9)'; ctx.lineWidth = 1.5 * dpr * thin; ctx.stroke(); ctx.setLineDash([]);
  path(groups.enemy); ctx.strokeStyle = 'rgba(255,40,40,0.25)'; ctx.lineWidth = 6 * dpr * thin; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,60,55,0.95)'; ctx.lineWidth = 1.8 * dpr * thin; ctx.stroke();
}

function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; draw(); }
let drag = null, pinch = null;
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, {passive: false});
function zoomAt(cx, cy, k) {
  const wx = (cx - innerWidth / 2) / view.z + view.x, wy = (cy - innerHeight / 2) / view.z + view.y;
  view.z = Math.min(4, Math.max(0.08, view.z * k));
  view.x = wx - (cx - innerWidth / 2) / view.z; view.y = wy - (cy - innerHeight / 2) / view.z; draw();
}
cv.addEventListener('pointerdown', e => drag = {x: e.clientX, y: e.clientY});
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag || pinch) return; view.x -= (e.clientX - drag.x) / view.z; view.y -= (e.clientY - drag.y) / view.z; drag = {x: e.clientX, y: e.clientY}; draw(); });
cv.addEventListener('touchmove', e => { if (e.touches.length === 2) { const [a, b] = e.touches, d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); if (pinch) zoomAt((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, d / pinch); pinch = d; } }, {passive: true});
cv.addEventListener('touchend', () => pinch = null);
window.mapView = (x, y, z) => { view = {x, y, z}; draw(); };
window.setRelations = (me, rel) => { ME = me; REL = rel; gen++; cache.clear(); draw(); };
window.tilesPending = () => [...cache.values()].filter(e => !e.canvas && !e.failed).length;

fetch(DATA + 'borders.json').then(r => r.ok ? r.json() : []).then(bs => {
  borders = bs.map(b => { let a = 1e9, c = 1e9, d = -1e9, e = -1e9; for (let i = 0; i < b.p.length; i += 2) { a = Math.min(a, b.p[i]); d = Math.max(d, b.p[i]); c = Math.min(c, b.p[i + 1]); e = Math.max(e, b.p[i + 1]); } return {...b, bb: [a, c, d, e]}; });
  draw();
}, () => 0);
fetch(DATA + 'world.json').then(r => r.json()).then(j => {
  world = j; [W, H] = j.size; countries = j.countries; countries.forEach(c => byIso[c.iso] = c);
  const rank = {capital: 0, major: 1, minor: 2};
  const crank = {playable: 0, ai: 1, neutral: 2};
  cityOrder = countries.flatMap(c => (c.cities || []).map(p => ({...p, area: c.area_km2, cls: c.class})))
    .sort((a, b) => rank[a.kind] - rank[b.kind] || crank[a.cls] - crank[b.cls] || b.area - a.area || b.pop - a.pop);
  const cap = (byIso[ME].cities || [])[0] || {x: W / 2, y: H / 2};
  view = {x: cap.x, y: cap.y, z: 0.5};
  addEventListener('resize', resize); resize();
  document.fonts.load('700 14px Alexandria').then(() => { draw(); document.title = 'World ready'; });
});
</script>
</body>
</html>
