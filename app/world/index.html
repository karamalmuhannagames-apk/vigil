<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World map prototype</title>
<style>
  @font-face{font-family:Alexandria;src:url(../fonts/Alexandria.ttf);font-weight:100 900}
  @font-face{font-family:Kufam;src:url(../fonts/Kufam.ttf);font-weight:400 900}
  html,body{margin:0;height:100%;background:#0d1b26;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #hud{position:fixed;left:12px;bottom:12px;color:#cfe3d4;font:600 13px system-ui;background:#0d1b26cc;padding:6px 10px;border-radius:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
// Real-world map, tiled: only the tiles on screen are loaded and coloured, so it stays fast on a phone.
// Each tile = satellite colour + a country-id image. Colour by relation is applied per tile, live,
// so declaring war or giving passage recolours the map instantly.
const DATA = new URLSearchParams(location.search).get('data') || '../../art/world/';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const T = 512;
let W, H, world, countries = [], byIso = {}, cityOrder = [];
// Relation colours as shadow -> highlight ramps measured from CoN screenshots. The terrain's own light and
// dark runs through the ramp, so forests, fields and hills stay visible in every colour.
// keep = how much of the natural terrain colour stays (own land is shown nearly as it is).
const RAMP = {
  me:      {lo: [26, 66, 30],   hi: [146, 190, 96],  keep: 0.6},
  ally:    {lo: [84, 104, 62],  hi: [188, 204, 146], keep: 0.15},   // pale olive, like Algeria in CoN
  passage: {lo: [12, 44, 22],   hi: [70, 118, 62],   keep: 0.10},
  neutral: {lo: [14, 32, 28],   hi: [62, 84, 78],    keep: 0.0},    // deep blue-green slate
  enemy:   {lo: [30, 4, 4],     hi: [142, 40, 34],   keep: 0.0},    // blood red, terrain showing through
};
let ME = 'JOR';
let REL = {SAU: 'ally', EGY: 'ally', IRQ: 'passage', IRN: 'enemy'};   // everyone else: neutral (dark slate)
const relOf = i => { const iso = countries[i]?.iso; return iso === ME ? 'me' : (REL[iso] || 'neutral'); };
let view = {x: 0, y: 0, z: 1};
let wavePat = null, manifest = null, ZMAX = 3;
load('waves.jpg').then(img => { wavePat = ctx.createPattern(img, 'repeat'); draw(); });
// gentle wave motion: a light redraw loop (about 12 frames a second, paused when the app is hidden)
setInterval(() => { if (!document.hidden && world && view.z > 0.15) draw(); }, 83);
const cache = new Map();   // key z/x/y -> {canvas} ; tinted tiles
let gen = 0;               // bumps when relations change: tinted tiles rebuilt

function load(src) { return new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = src; }); }

async function buildTile(z, tx, ty) {
  const [sat, nat] = await Promise.all([load(`${DATA}tiles/${z}/${tx}_${ty}.jpg`), load(`${DATA}tiles/${z}/${tx}_${ty}_n.png`)]);
  const w = sat.width, h = sat.height;
  const mkc = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const landC = mkc(), g = landC.getContext('2d', {willReadFrequently: true});
  g.drawImage(nat, 0, 0); const nd = g.getImageData(0, 0, w, h).data;
  g.drawImage(sat, 0, 0); const id = g.getImageData(0, 0, w, h), d = id.data;
  const seaC = mkc(), sg = seaC.getContext('2d'), sid = sg.createImageData(w, h), sd = sid.data;
  const lut = {};
  let anySea = false, anyLand = false;
  for (let p = 0, q = 0; p < w * h; p++, q += 4) {
    const n = nd[q] + nd[q + 1] * 256 - 1;
    if (n < 0) {
      // sea: this pixel is a light/shadow code laid over the waves (land shadow on the water, lighter shallows)
      sd[q] = d[q]; sd[q + 1] = d[q + 1]; sd[q + 2] = d[q + 2]; sd[q + 3] = 255; d[q + 3] = 0; anySea = true;
      continue;
    }
    anyLand = true;
    const r = lut[n] || (lut[n] = RAMP[relOf(n)]);
    const t = Math.min(1, Math.max(0, ((0.3 * d[q] + 0.59 * d[q + 1] + 0.11 * d[q + 2]) / 255 - 0.14) / 0.6));
    const k = r.keep, lo = r.lo, hi = r.hi;
    d[q]     = d[q]     * k + (lo[0] + (hi[0] - lo[0]) * t) * (1 - k);
    d[q + 1] = d[q + 1] * k + (lo[1] + (hi[1] - lo[1]) * t) * (1 - k);
    d[q + 2] = d[q + 2] * k + (lo[2] + (hi[2] - lo[2]) * t) * (1 - k);
  }
  // soft coastline: land pixels next to the sea get partial cover, so coasts stay smooth when zoomed in
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const q = (y * w + x) * 4; if (d[q + 3] === 0) continue;
    const n = (d[q - 4 + 3] === 0) + (d[q + 4 + 3] === 0) + (d[q - w * 4 + 3] === 0) + (d[q + w * 4 + 3] === 0);
    if (n) d[q + 3] = 255 - n * 40;
  }
  g.putImageData(id, 0, 0); sg.putImageData(sid, 0, 0);
  return {land: anyLand ? landC : null, sea: anySea ? seaC : null};
}

function tileFor(z, tx, ty) {
  const k = `${gen}/${z}/${tx}/${ty}`;
  let e = cache.get(k);
  if (!e) {
    e = {canvas: null}; cache.set(k, e);
    if (manifest && !manifest[z]?.has(`${tx}_${ty}`)) { e.canvas = {land: null, sea: null}; return e.canvas; }   // open sea: waves only
    buildTile(z, tx, ty).then(c => { e.canvas = c; draw(); }, () => { e.failed = true; });
    if (cache.size > 220) { const old = cache.keys().next().value; cache.delete(old); }
  }
  return e.canvas;
}

const smooth = (a, b, v) => Math.min(1, Math.max(0, (v - a) / (b - a)));
function draw() {
  if (!world) return;
  const dpr = devicePixelRatio, sw = cv.width, sh = cv.height, s = view.z * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // the sea: CoN-like blue with real wave ripples, anchored to the map and drifting slowly
  if (wavePat) {
    const ws = Math.max(0.3 * devicePixelRatio, Math.min(1.1 * devicePixelRatio, s * 0.42));   // waves grow as you zoom in, within natural limits
    const t = performance.now() / 1000, P = 512 * ws;
    const mod = (v) => ((v % P) + P) % P;
    wavePat.setTransform(new DOMMatrix([ws, 0, 0, ws, mod(-view.x * s + sw / 2 + t * 5 * ws), mod(-view.y * s + sh / 2 + t * 1.6 * ws)]));
    ctx.fillStyle = wavePat;
  } else ctx.fillStyle = '#2e4f66';
  ctx.fillRect(0, 0, sw, sh);
  // far away the ripples would shimmer: fade them to the calm sea colour
  const calm = 1 - smooth(0.15, 0.45, view.z);
  if (calm > 0) { ctx.globalAlpha = calm; ctx.fillStyle = '#2e4f66'; ctx.fillRect(0, 0, sw, sh); ctx.globalAlpha = 1; }
  // zoom level: full resolution (3) when close, coarser tiles when far
  const z = Math.max(0, Math.min(ZMAX, Math.round(3 + Math.log2(view.z) + 0.25)));
  const f = 2 ** (3 - z);                     // world px per tile px (0.5 at the sharpest level)
  const x0 = view.x - sw / 2 / s, y0 = view.y - sh / 2 / s, x1 = view.x + sw / 2 / s, y1 = view.y + sh / 2 / s;
  ctx.imageSmoothingQuality = 'high';
  const vis = [];
  for (let ty = Math.max(0, Math.floor(y0 / (T * f))); ty * T * f < Math.min(H, y1); ty++)
    for (let tx = Math.max(0, Math.floor(x0 / (T * f))); tx * T * f < Math.min(W, x1); tx++) {
      let c = tileFor(z, tx, ty), ox = 0, oy = 0, sc = 1;
      // while a sharp tile loads, show the coarser parent so the map never has holes
      if (!c && z > 0) { const p = cache.get(`${gen}/${z - 1}/${tx >> 1}/${ty >> 1}`); if (p?.canvas) { c = p.canvas; ox = (tx & 1) * T / 2; oy = (ty & 1) * T / 2; sc = 2; } }
      if (!c) continue;
      vis.push([c, (tx * T * f - view.x) * s + sw / 2, (ty * T * f - view.y) * s + sh / 2, ox, oy, sc]);
    }
  const put = (img, px, py, ox, oy, sc) => {
    // snap tiles to whole screen pixels so no hairline shows between them
    const x0 = Math.round(px), y0 = Math.round(py);
    if (sc === 1) ctx.drawImage(img, x0, y0, Math.round(px + img.width * f * s) - x0, Math.round(py + img.height * f * s) - y0);
    else ctx.drawImage(img, ox, oy, T / 2, T / 2, x0, y0, Math.round(px + T * f * s) - x0, Math.round(py + T * f * s) - y0);
  };
  ctx.globalCompositeOperation = 'hard-light';                      // light and shadow on the water
  for (const [c, px, py, ox, oy, sc] of vis) if (c.sea) put(c.sea, px, py, ox, oy, sc);
  ctx.globalCompositeOperation = 'source-over';
  for (const [c, px, py, ox, oy, sc] of vis) if (c.land) put(c.land, px, py, ox, oy, sc);
  drawCities(s, sw, sh);
  drawBorders(s, sw, sh);
  // cities: most important first; a label that would overlap one already placed is skipped (no clutter, ever)
  ctx.textAlign = 'center';
  const placed = [];
  for (const p of cityOrder) {
    // when names appear: big playable capitals first, small and computer-run countries only closer in
    const big = p.area >= 300000;
    const capAt = p.cls === 'neutral' ? 1.2 : p.cls === 'ai' ? 0.7 : big ? 0.12 : 0.3;
    const show = p.kind === 'capital' ? smooth(capAt, capAt * 1.5, view.z) : p.kind === 'major' ? smooth(0.55, 0.8, view.z) : smooth(1.1, 1.5, view.z);
    if (!show) continue;
    const sx = (p.x - view.x) * s + sw / 2, sy = (p.y - view.y) * s + sh / 2;
    if (sx < -100 || sy < -50 || sx > sw + 100 || sy > sh + 50) continue;
    const fs0 = (p.kind === 'capital' ? 14 : 12) * dpr;
    ctx.font = p.kind === 'capital' ? `800 ${fs0}px Kufam, Alexandria, system-ui` : `600 ${fs0}px Alexandria, system-ui`;
    const tw = ctx.measureText(p.name_ar).width, box = [sx - tw / 2 - 4 * dpr, sy - fs0 - 10 * dpr, sx + tw / 2 + 4 * dpr, sy + 5 * dpr];
    // a phone screen is small: keep generous breathing room around every name
    const pad = 14 * dpr;
    if (placed.some(b => box[0] - pad < b[2] && box[2] + pad > b[0] && box[1] - pad < b[3] && box[3] + pad > b[1])) continue;
    placed.push(box);
    ctx.globalAlpha = show;
    const r = (p.kind === 'capital' ? 4 : 3) * dpr * (1 - smooth(0.9, 1.7, view.z));
    ctx.fillStyle = p.kind === 'capital' ? '#ffd34d' : '#f4f6f2'; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = dpr;
    if (r > 0.5) { ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill(); ctx.stroke(); }
    const fs = (p.kind === 'capital' ? 14 : 12) * dpr;
    ctx.font = p.kind === 'capital' ? `800 ${fs}px Kufam, Alexandria, system-ui` : `600 ${fs}px Alexandria, system-ui`; ctx.lineWidth = 3 * dpr; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgb(12,16,20)';   // opaque halo: no dark blobs where Arabic letters join
    const near = smooth(0.9, 1.7, view.z), ly = (sy - r - 4 * dpr) * (1 - near) + (sy + CR[p.kind] * s * 0.8 + fs) * near;   // close up the name sits under the town
    ctx.strokeText(p.name_ar, sx, ly); ctx.fillStyle = '#f4f6f2'; ctx.fillText(p.name_ar, sx, ly);
  }
  ctx.globalAlpha = 1;
  document.getElementById('hud').textContent = `zoom ${view.z.toFixed(2)} · tiles z${z}`;
}


// ---------- cities on the real map ----------
// Each city is a small baked picture: regional city blocks inside a soft, irregular outline, the main
// buildings of a capital set in, coloured with the same relation ramp as its land. Far away it melts into a
// marker; close up it is a real town sitting in the terrain (not a sticker).
const ART_ROOT = DATA + '../';
const CR = {capital: 15, major: 11, minor: 8};          // city radius in world px (map scale is exaggerated for play)
const cityPics = new Map(), blockImg = {}, bldImg = {};
function img(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }
async function blocksFor(art) {
  if (!blockImg[art]) blockImg[art] = Promise.all([1, 2, 3, 4].map(k => img(`${ART_ROOT}cityblocks/block_${art}_${k}.png`))).then(a => a.filter(Boolean));
  return blockImg[art];
}
async function building(type, art, L) {
  const k = `${type}_${art}_${L}`;
  if (!(k in bldImg)) bldImg[k] = img(`${ART_ROOT}buildings/${k}.png`);
  return bldImg[k];
}
function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; }
async function bakeCity(p, ci) {
  const c = countries[ci], art = c.art || 'americas', rel = relOf(ci), ramp = RAMP[rel];
  const N = 320, R = N / 2;
  const cv2 = document.createElement('canvas'); cv2.width = cv2.height = N;
  const g = cv2.getContext('2d', {willReadFrequently: true});
  const bl = await blocksFor(art);
  const seed = hash(p.name_en || p.name_ar);
  if (bl.length) {
    g.save(); g.translate(R, R); g.rotate(seed * 6.283); g.drawImage(bl[Math.floor(seed * bl.length)], -R * 1.2, -R * 1.2, R * 2.4, R * 2.4); g.restore();
  }
  // main buildings in the heart of capitals and big cities
  const set = p.kind === 'capital' ? [['factory', 3], ['airport', 2], ['training_camp', 2], ['hospital', 1]] : p.kind === 'major' ? [['factory', 1], ['training_camp', 1]] : [];
  for (let k = 0; k < set.length; k++) {
    const b = await building(set[k][0], art, set[k][1]); if (!b) continue;
    const a = seed * 6.283 + k * 1.7, rr = k === 0 ? 0 : R * 0.36, sz = R * 0.62;
    g.drawImage(b, R + Math.cos(a) * rr - sz / 2, R + Math.sin(a) * rr - sz / 2, sz, sz);
  }
  // same colour ramp as the land around it
  const id = g.getImageData(0, 0, N, N), d = id.data;
  for (let q = 0; q < d.length; q += 4) {
    const t = Math.min(1, Math.max(0, ((0.3 * d[q] + 0.59 * d[q + 1] + 0.11 * d[q + 2]) / 255 - 0.14) / 0.6));
    const k = Math.max(ramp.keep, 0.25), lo = ramp.lo, hi = ramp.hi;    // cities keep a little more of their own colour
    d[q] = d[q] * k + (lo[0] + (hi[0] - lo[0]) * t) * (1 - k);
    d[q + 1] = d[q + 1] * k + (lo[1] + (hi[1] - lo[1]) * t) * (1 - k);
    d[q + 2] = d[q + 2] * k + (lo[2] + (hi[2] - lo[2]) * t) * (1 - k);
  }
  g.putImageData(id, 0, 0);
  // soft irregular outline: dense centre, broken suburbs
  const m = document.createElement('canvas'); m.width = m.height = N; const mg = m.getContext('2d');
  const grd = mg.createRadialGradient(R, R, R * 0.15, R, R, R * 0.95);
  grd.addColorStop(0, 'rgba(0,0,0,1)'); grd.addColorStop(0.55, 'rgba(0,0,0,0.85)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  mg.fillStyle = grd; mg.fillRect(0, 0, N, N);
  let rs = seed * 1000;
  const rnd = () => { rs = (rs * 9301 + 49297) % 233280; return rs / 233280; };
  mg.globalCompositeOperation = 'destination-out';
  for (let k = 0; k < 70; k++) {                                   // gaps in the outskirts
    const a = rnd() * 6.283, rr = R * (0.55 + rnd() * 0.45), s2 = R * (0.06 + rnd() * 0.12);
    mg.beginPath(); mg.arc(R + Math.cos(a) * rr, R + Math.sin(a) * rr, s2, 0, 7); mg.fill();
  }
  mg.globalCompositeOperation = 'source-over';
  for (let k = 0; k < 10; k++) {                                   // and a few lobes reaching out along roads
    const a = rnd() * 6.283, rr = R * (0.5 + rnd() * 0.3), s2 = R * (0.08 + rnd() * 0.08);
    mg.globalAlpha = 0.7; mg.beginPath(); mg.arc(R + Math.cos(a) * rr, R + Math.sin(a) * rr, s2, 0, 7); mg.fill();
  }
  // a town never spills into the sea or across a border: keep only its own country's land
  const own = await ownLand(p, ci, N);
  if (own) { mg.globalCompositeOperation = 'destination-in'; mg.drawImage(own, 0, 0, N, N); mg.globalCompositeOperation = 'source-over'; }
  g.globalCompositeOperation = 'destination-in'; g.filter = 'blur(2px)'; g.drawImage(m, 0, 0); g.filter = 'none';
  // built-up ground darkens slightly around the city so it settles into the terrain
  const out = document.createElement('canvas'); out.width = out.height = N; const og = out.getContext('2d');
  const hal = og.createRadialGradient(R, R, R * 0.3, R, R, R);
  hal.addColorStop(0, 'rgba(10,14,12,0.35)'); hal.addColorStop(1, 'rgba(10,14,12,0)');
  og.fillStyle = hal; og.fillRect(0, 0, N, N); og.drawImage(cv2, 0, 0);
  return out;
}
// country ids around a city, read from the sharpest id tiles (2 px per world px)
const idTiles = new Map();
function idTile(tx, ty) {
  const k = `${tx}_${ty}`;
  if (!idTiles.has(k)) idTiles.set(k, (manifest && !manifest[4]?.has(k)) ? Promise.resolve(null) : img(`${DATA}tiles/4/${k}_n.png`));
  return idTiles.get(k);
}
async function ownLand(p, ci, N) {
  const R = CR[p.kind], x0 = (p.x - R) * 2, y0 = (p.y - R) * 2, n = Math.ceil(R * 4);
  const c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d', {willReadFrequently: true});
  for (let ty = Math.floor(y0 / T); ty <= Math.floor((y0 + n) / T); ty++)
    for (let tx = Math.floor(x0 / T); tx <= Math.floor((x0 + n) / T); tx++) {
      const im = await idTile(tx, ty); if (im) g.drawImage(im, tx * T - x0, ty * T - y0);
    }
  const id = g.getImageData(0, 0, n, n), d = id.data;
  for (let q = 0; q < d.length; q += 4) { const v = d[q] + d[q + 1] * 256 - 1; d[q + 3] = v === ci ? 255 : 0; }
  g.putImageData(id, 0, 0);
  return c;
}
function cityPic(p, ci) {
  const k = `${gen}/${p.name_en}/${ci}`;
  let e = cityPics.get(k);
  if (!e) { e = {pic: null}; cityPics.set(k, e); bakeCity(p, ci).then(pic => { e.pic = pic; draw(); }); }
  return e.pic;
}
function drawCities(s, sw, sh) {
  const show = smooth(0.9, 1.7, view.z);
  if (show <= 0) return;
  ctx.globalAlpha = show;
  for (let ci = 0; ci < countries.length; ci++) for (const p of countries[ci].cities || []) {
    const R = CR[p.kind] * s, sx = (p.x - view.x) * s + sw / 2, sy = (p.y - view.y) * s + sh / 2;
    if (sx < -R || sy < -R || sx > sw + R || sy > sh + R) continue;
    const pic = cityPic(p, ci); if (pic) ctx.drawImage(pic, sx - R, sy - R, R * 2, R * 2);
  }
  ctx.globalAlpha = 1;
}

// smooth vector borders, styled by relation: none with allies, dashed for passage, solid for strangers, red for enemies
let borders = [], provLines = [];
function borderKind(a, b) {
  const ia = countries[a]?.iso, ib = countries[b]?.iso;
  if (ia !== ME && ib !== ME) return 'foreign';
  return relOf(ia === ME ? b : a);
}
function drawBorders(s, sw, sh) {
  const dpr = devicePixelRatio;
  const x0 = view.x - sw / 2 / s, x1 = view.x + sw / 2 / s, y0 = view.y - sh / 2 / s, y1 = view.y + sh / 2 / s;
  const groups = {foreign: [], neutral: [], passage: [], enemy: []};
  for (const b of borders) {
    if (b.bb[2] < x0 || b.bb[0] > x1 || b.bb[3] < y0 || b.bb[1] > y1) continue;
    const k = borderKind(b.a, b.b); if (k === 'ally' || k === 'me') continue;
    (groups[k] || groups.neutral).push(b);
  }
  const path = list => { ctx.beginPath(); for (const b of list) { const p = b.p; ctx.moveTo((p[0] - view.x) * s + sw / 2, (p[1] - view.y) * s + sh / 2); for (let i = 2; i < p.length; i += 2) ctx.lineTo((p[i] - view.x) * s + sw / 2, (p[i + 1] - view.y) * s + sh / 2); } };
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const thin = Math.min(1, 0.6 + view.z * 0.5);
  // province outlines: thin and quiet, like CoN's inner lines; they appear as you zoom in
  const pv = smooth(0.35, 0.8, view.z);
  if (pv > 0 && provLines.length) {
    ctx.beginPath();
    for (const L of provLines) {
      if (L.bb[2] < x0 || L.bb[0] > x1 || L.bb[3] < y0 || L.bb[1] > y1) continue;
      const p = L.p; ctx.moveTo((p[0] - view.x) * s + sw / 2, (p[1] - view.y) * s + sh / 2);
      for (let i = 2; i < p.length; i += 2) ctx.lineTo((p[i] - view.x) * s + sw / 2, (p[i + 1] - view.y) * s + sh / 2);
    }
    ctx.strokeStyle = `rgba(240,244,240,${0.32 * pv})`; ctx.lineWidth = 0.9 * dpr; ctx.stroke();
  }
  path(groups.foreign); ctx.strokeStyle = 'rgba(235,240,245,0.45)'; ctx.lineWidth = 1 * dpr * thin; ctx.stroke();
  path(groups.neutral); ctx.strokeStyle = 'rgba(245,247,250,0.9)'; ctx.lineWidth = 1.5 * dpr * thin; ctx.stroke();
  path(groups.passage); ctx.setLineDash([5 * dpr, 4 * dpr]); ctx.strokeStyle = 'rgba(245,247,250,0.9)'; ctx.lineWidth = 1.5 * dpr * thin; ctx.stroke(); ctx.setLineDash([]);
  path(groups.enemy); ctx.strokeStyle = 'rgba(255,40,40,0.25)'; ctx.lineWidth = 6 * dpr * thin; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,60,55,0.95)'; ctx.lineWidth = 1.8 * dpr * thin; ctx.stroke();
}

function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; draw(); }
let drag = null, pinch = null;
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, {passive: false});
function zoomAt(cx, cy, k) {
  const wx = (cx - innerWidth / 2) / view.z + view.x, wy = (cy - innerHeight / 2) / view.z + view.y;
  view.z = Math.min(7, Math.max(0.08, view.z * k));
  view.x = wx - (cx - innerWidth / 2) / view.z; view.y = wy - (cy - innerHeight / 2) / view.z; draw();
}
cv.addEventListener('pointerdown', e => drag = {x: e.clientX, y: e.clientY});
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag || pinch) return; view.x -= (e.clientX - drag.x) / view.z; view.y -= (e.clientY - drag.y) / view.z; drag = {x: e.clientX, y: e.clientY}; draw(); });
cv.addEventListener('touchmove', e => { if (e.touches.length === 2) { const [a, b] = e.touches, d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); if (pinch) zoomAt((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, d / pinch); pinch = d; } }, {passive: true});
cv.addEventListener('touchend', () => pinch = null);
window.mapView = (x, y, z) => { view = {x, y, z}; draw(); };
window.setRelations = (me, rel) => { ME = me; REL = rel; gen++; cache.clear(); draw(); };
window.tilesPending = () => [...cache.values()].filter(e => !e.canvas && !e.failed).length;
window.world_ = () => world;

const bbox = p => { let a = 1e9, c = 1e9, d = -1e9, e = -1e9; for (let i = 0; i < p.length; i += 2) { a = Math.min(a, p[i]); d = Math.max(d, p[i]); c = Math.min(c, p[i + 1]); e = Math.max(e, p[i + 1]); } return [a, c, d, e]; };
fetch(DATA + 'province_lines.json').then(r => r.ok ? r.json() : []).then(ls => { provLines = ls.map(p => ({p, bb: bbox(p)})); draw(); }, () => 0);
fetch(DATA + 'borders.json').then(r => r.ok ? r.json() : []).then(bs => {
  borders = bs.map(b => { let a = 1e9, c = 1e9, d = -1e9, e = -1e9; for (let i = 0; i < b.p.length; i += 2) { a = Math.min(a, b.p[i]); d = Math.max(d, b.p[i]); c = Math.min(c, b.p[i + 1]); e = Math.max(e, b.p[i + 1]); } return {...b, bb: [a, c, d, e]}; });
  draw();
}, () => 0);
fetch(DATA + 'world.json').then(r => r.json()).then(async j => {
  try { const m = await (await fetch(DATA + 'tiles/tiles.json')).json(); manifest = {}; for (const k in m) manifest[k] = new Set(m[k]); ZMAX = Math.max(...Object.keys(m).map(Number)); } catch (e) {}
  world = j; [W, H] = j.size; countries = j.countries; countries.forEach(c => byIso[c.iso] = c);
  const rank = {capital: 0, major: 1, minor: 2};
  const crank = {playable: 0, ai: 1, neutral: 2};
  cityOrder = countries.flatMap(c => (c.cities || []).map(p => ({...p, area: c.area_km2, cls: c.class})))
    .sort((a, b) => rank[a.kind] - rank[b.kind] || crank[a.cls] - crank[b.cls] || b.area - a.area || b.pop - a.pop);
  const cap = (byIso[ME].cities || [])[0] || {x: W / 2, y: H / 2};
  view = {x: cap.x, y: cap.y, z: 0.5};
  addEventListener('resize', resize); resize();
  Promise.all([document.fonts.load('700 14px Alexandria', 'عمان'), document.fonts.load('800 14px Kufam', 'عمان')]).then(() => { draw(); document.title = 'World ready'; });
});
</script>
