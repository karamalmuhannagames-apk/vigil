<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World map prototype</title>
<style>
  @font-face{font-family:Plex;src:url(../fonts/IBMPlexSansArabic-Medium.ttf);font-weight:500}
  @font-face{font-family:Plex;src:url(../fonts/IBMPlexSansArabic-Bold.ttf);font-weight:700}
  html,body{margin:0;height:100%;background:#0d1b26;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #hud{position:fixed;left:12px;bottom:12px;color:#cfe3d4;font:600 13px system-ui;background:#0d1b26cc;padding:6px 10px;border-radius:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
// Real-world map, tiled: only the tiles on screen are loaded and coloured, so it stays fast on a phone.
// Each tile = big light and shade + forest/desert/rock weights + a country-id image. The game paints the
// ground from small textures and colours it by relation, live, so declaring war recolours the map instantly.
const DATA = new URLSearchParams(location.search).get('data') || '../../art/world/';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const T = 512;
let W, H, world, countries = [], byIso = {}, cityOrder = [];
// Relation colours measured from CoN screenshots: 7 colour stops per relation, darkest to lightest, taken from
// real map pixels of each relation (own green, ally pale olive, stranger blue-grey slate, enemy blood red).
// The painted ground's light and dark picks a colour along the stops, so terrain shows in every colour.
const STOPS = {"ally":[[90,105,77],[98,116,83],[106,125,89],[118,137,100],[128,153,106],[137,161,109],[143,166,113]],"enemy":[[53,16,8],[56,19,11],[63,21,16],[71,26,20],[82,30,24],[117,34,38],[126,38,43]],"neutral":[[9,22,17],[10,23,19],[10,27,21],[18,36,29],[21,41,33],[32,50,43],[40,58,51]],"me":[[44,75,33],[58,91,46],[76,116,62],[99,145,81],[112,181,94],[128,191,100],[135,198,104]],"passage":[[31,54,23],[41,65,33],[54,83,44],[71,104,58],[80,130,67],[92,137,72],[97,142,74]]};
const STOP_AT = [0.06, 0.16, 0.30, 0.45, 0.58, 0.68, 0.80];   // which ground brightness lands on each stop
const LUT = {};
for (const [k, st] of Object.entries(STOPS)) {
  const t = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const v = i / 255; let j = 0;
    while (j < STOP_AT.length - 2 && v > STOP_AT[j + 1]) j++;
    const u = Math.min(1, Math.max(0, (v - STOP_AT[j]) / (STOP_AT[j + 1] - STOP_AT[j])));
    for (let c = 0; c < 3; c++) t[i * 3 + c] = st[j][c] + (st[j + 1][c] - st[j][c]) * u;
  }
  LUT[k] = t;
}
const SEA = {coast: [64, 90, 103], deep: [25, 55, 81]};   // measured from CoN: coastal waters and open ocean
let ME = 'JOR';
let REL = {SAU: 'ally', EGY: 'ally', IRQ: 'passage', IRN: 'enemy'};   // everyone else: neutral (dark slate)
const relOf = i => { const iso = countries[i]?.iso; return iso === ME ? 'me' : (REL[iso] || 'neutral'); };
let view = {x: 0, y: 0, z: 1};
let manifest = null, ZMAX = 3, TEX = null, deepPat = null;
// ground textures, read once into plain arrays (the tile painter samples them per pixel)
function pixels(img, w, h) { const c = document.createElement('canvas'); c.width = w || img.width; c.height = h || img.height; const g = c.getContext('2d', {willReadFrequently: true}); g.drawImage(img, 0, 0, c.width, c.height); return g.getImageData(0, 0, c.width, c.height).data; }
const SRGB = new Float32Array(256); for (let i = 0; i < 256; i++) { const v = i / 255; SRGB[i] = v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }
Promise.all(['forest', 'forest_id', 'open', 'arid', 'rock', 'waves'].map(n => load(n === 'waves' ? 'waves.jpg' : `tex/${n}.png`).catch(() => null))).then(([fo, fid, op, ar, rk, wv]) => {
  const one = (img, n) => { const d = pixels(img, n, n), a = new Uint8Array(n * n); for (let i = 0; i < n * n; i++) a[i] = d[i * 4]; return a; };
  const FN = fo ? fo.width : 1024;
  const fd = pixels(fo), fl = new Uint8Array(FN * FN), fa = new Uint8Array(FN * FN), fv = new Uint8Array(FN * FN);
  for (let i = 0; i < FN * FN; i++) { fl[i] = fd[i * 4]; fa[i] = fd[i * 4 + 3]; }
  if (fid) { const d = pixels(fid, FN, FN); for (let i = 0; i < FN * FN; i++) fv[i] = Math.round(SRGB[d[i * 4]] * 255); }   // tree values were saved through sRGB
  // waves: sea ripples, as a brightness texture around 1.0
  const WN = 512, wd = pixels(wv, WN, WN), wave = new Float32Array(WN * WN); let m = 0;
  for (let i = 0; i < WN * WN; i++) { wave[i] = wd[i * 4] * 0.3 + wd[i * 4 + 1] * 0.59 + wd[i * 4 + 2] * 0.11; m += wave[i]; }
  m /= WN * WN; for (let i = 0; i < WN * WN; i++) wave[i] = wave[i] / m - 1;      // ripple shape; contrast is set per zoom
  TEX = {FN, fl, fa, fv, open: one(op, 512), arid: one(ar, 512), rock: one(rk, 512), wave, WN};
  // open ocean with no tile: a deep-sea pattern built the same way
  const dc = document.createElement('canvas'); dc.width = dc.height = WN; const dg = dc.getContext('2d'), di = dg.createImageData(WN, WN);
  for (let i = 0; i < WN * WN; i++) { const k = 1 + wave[i] * 0.2; di.data[i * 4] = SEA.deep[0] * k; di.data[i * 4 + 1] = SEA.deep[1] * k; di.data[i * 4 + 2] = SEA.deep[2] * k; di.data[i * 4 + 3] = 255; }
  dg.putImageData(di, 0, 0); deepPat = ctx.createPattern(dc, 'repeat');
  cache.clear(); draw();
});
// gentle wave motion: a light redraw loop (about 12 frames a second, paused when the app is hidden)
setInterval(() => { if (!document.hidden && world && view.z > 0.15) draw(); }, 83);
const cache = new Map();   // key z/x/y -> {canvas} ; tinted tiles
let gen = 0;               // bumps when relations change: tinted tiles rebuilt

function load(src) { return new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = src; }); }

// Paints one tile at C x C pixels: the ground textures (crisp, one texture pixel per tile pixel), mixed by the
// real forest / desert / rock weights, shaded by the real relief, then coloured by who owns the land.
async function buildTile(z, tx, ty, C) {
  const [lumI, bioI, natI] = await Promise.all([load(`${DATA}tiles/${z}/${tx}_${ty}.jpg`), load(`${DATA}tiles/${z}/${tx}_${ty}_b.png`), load(`${DATA}tiles/${z}/${tx}_${ty}_n.png`)]);
  const c = document.createElement('canvas'); c.width = c.height = C;
  const g = c.getContext('2d', {willReadFrequently: true});
  // smooth land mask: the id image upscaled with smoothing, so coasts are clean curves, never pixel stairs
  const N0 = natI.width, mc = document.createElement('canvas'); mc.width = mc.height = N0;
  const mg = mc.getContext('2d', {willReadFrequently: true}); mg.drawImage(natI, 0, 0);
  const mi = mg.getImageData(0, 0, N0, N0), md = mi.data;
  // country id per source pixel, and a smooth owner per painted pixel: where countries meet, the owner is the one
  // with the largest bilinear share, so borders between colours are smooth curves at every zoom, never stairs
  const ids = new Int32Array(N0 * N0); for (let i = 0; i < N0 * N0; i++) ids[i] = md[i * 4] + md[i * 4 + 1] * 256 - 1;
  const own = new Int32Array(C * C), sc = N0 / C;
  for (let y = 0; y < C; y++) {
    const v = Math.max(0, Math.min(N0 - 1.001, (y + 0.5) * sc - 0.5)), y0 = v | 0, fy = v - y0, y1 = Math.min(N0 - 1, y0 + 1);
    for (let x = 0; x < C; x++) {
      const u = Math.max(0, Math.min(N0 - 1.001, (x + 0.5) * sc - 0.5)), x0 = u | 0, fx = u - x0, x1 = Math.min(N0 - 1, x0 + 1);
      const a = ids[y0 * N0 + x0], b = ids[y0 * N0 + x1], c2 = ids[y1 * N0 + x0], d2 = ids[y1 * N0 + x1];
      if (a === b && a === c2 && a === d2 && fx > 0.25 && fx < 0.75 && fy > 0.25 && fy < 0.75) { own[y * C + x] = a; continue; }
      if (a === b && a === c2 && a === d2) { const e = ids[Math.max(0, y0 - 1) * N0 + x0] === a && ids[Math.min(N0 - 1, y1 + 1) * N0 + x1] === a && ids[y0 * N0 + Math.max(0, x0 - 1)] === a && ids[y1 * N0 + Math.min(N0 - 1, x1 + 1)] === a; if (e) { own[y * C + x] = a; continue; } }
      // where countries meet: each nearby source pixel votes with a soft 1.6-px tent, so the edge is a smooth curve
      const tally = new Map();
      for (let j = -1; j <= 2; j++) for (let i = -1; i <= 2; i++) {
        const xi = Math.max(0, Math.min(N0 - 1, x0 + i)), yj = Math.max(0, Math.min(N0 - 1, y0 + j));
        const wx = Math.max(0, 1 - Math.abs(u - (x0 + i)) / 1.6), wy = Math.max(0, 1 - Math.abs(v - (y0 + j)) / 1.6);
        const ww = wx * wy; if (!ww) continue;
        const id = ids[yj * N0 + xi]; tally.set(id, (tally.get(id) || 0) + ww);
      }
      let best = a, bw = -1;
      for (const [id, t] of tally) if (t > bw) { bw = t; best = id; }
      own[y * C + x] = best;
    }
  }
  for (let q = 0; q < md.length; q += 4) { const land = md[q] + md[q + 1] > 0; md[q] = md[q + 1] = md[q + 2] = land ? 255 : 0; md[q + 3] = 255; }
  mg.putImageData(mi, 0, 0);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(mc, 0, 0, C, C); const ms = g.getImageData(0, 0, C, C).data;
  g.drawImage(lumI, 0, 0, C, C); const ld = g.getImageData(0, 0, C, C).data;
  g.drawImage(bioI, 0, 0, C, C); const bd = g.getImageData(0, 0, C, C).data;
  const out = g.createImageData(C, C), d = out.data;
  const {FN, fl, fa, fv, open, arid, rock, wave, WN} = TEX;
  const wamp = [0.16, 0.22, 0.3, 0.42, 0.5][z] || 0.5;          // CoN: same ripple size on screen, stronger close in
  const gx0 = tx * C, gy0 = ty * C;
  const lut = {};
  const idAt = (x, y) => { x = Math.max(0, Math.min(C - 1, x)); y = Math.max(0, Math.min(C - 1, y)); return own[y * C + x]; };
  for (let y = 0; y < C; y++) {
    const gy = gy0 + y, fr = (gy % FN) * FN, gr = (gy & 511) * 512, wr = (gy % WN) * WN;
    for (let x = 0; x < C; x++) {
      const q = (y * C + x) * 4, gx = gx0 + x;
      const m = ms[q];                                          // 0 sea .. 255 land, soft at the coast
      let n = own[y * C + x];
      const L = ld[q] / 127.5;                                  // 1.0 = no extra light or shade
      let sr = 0, sg = 0, sb = 0;
      if (m < 170) {                                            // sea: coastal grey-blue or deep blue, ripples, land shadow
        const cw = m > 0 ? 1 : bd[q] / 255, k = L * (1 + wamp * wave[wr + gx % WN]);     // coastal share: soft edge between coastal and deep water
        sr = (SEA.deep[0] + (SEA.coast[0] - SEA.deep[0]) * cw) * k; sg = (SEA.deep[1] + (SEA.coast[1] - SEA.deep[1]) * cw) * k; sb = (SEA.deep[2] + (SEA.coast[2] - SEA.deep[2]) * cw) * k;
        if (m > 14) { const e = 1 - 0.55 * Math.min(1, (m - 14) / 50); sr *= e; sg *= e; sb *= e; }   // thin dark rim along every coast
        if (m < 86) { d[q] = sr; d[q + 1] = sg; d[q + 2] = sb; d[q + 3] = 255; continue; }
      }
      if (n < 0) {                                              // land by the smooth mask but sea by the id image: borrow a neighbour's id
        for (let r = 1; r < 6 && n < 0; r++) n = Math.max(idAt(x - r, y), idAt(x + r, y), idAt(x, y - r), idAt(x, y + r));
        if (n < 0) { d[q] = sr; d[q + 1] = sg; d[q + 2] = sb; d[q + 3] = 255; continue; }
      }
      const gi = gr + (gx & 511), ar = bd[q + 1] / 255, rk = bd[q + 2] / 255;
      let v = open[gi] * (1 - ar) + arid[gi] * ar;
      v = v * (1 - rk) + rock[gi] * rk;
      const fi = fr + gx % FN, a = fa[fi];
      if (a) {                                                  // a tree (or its shadow) stands here if the forest is dense enough
        const dens = bd[q] / 255 + (open[(gi + 131 * 512 + 77) & 262143] - 158) * 0.006, tv = fv[fi] / 255;   // a little noise: forest edges never follow the data's pixel grid
        if (tv ? dens > tv : dens > 0.55) { const al = a / 255; v = v * (1 - al) + fl[fi] * al; }
      }
      const t = lut[n] || (lut[n] = LUT[relOf(n)]);
      const i = (Math.min(255, v * L) | 0) * 3;
      if (m >= 170) { d[q] = t[i]; d[q + 1] = t[i + 1]; d[q + 2] = t[i + 2]; }
      else { const w = (m - 86) / 84; d[q] = sr + (t[i] - sr) * w; d[q + 1] = sg + (t[i + 1] - sg) * w; d[q + 2] = sb + (t[i + 2] - sb) * w; }

    }

  return c;
}

function tileFor(z, tx, ty, C) {
  const k = `${gen}/${C}/${z}/${tx}/${ty}`;
  let e = cache.get(k);
  if (!e) {
    e = {canvas: null}; cache.set(k, e);
    if (!TEX) { cache.delete(k); return null; }
    if (manifest && !manifest[z]?.has(`${tx}_${ty}`)) { e.canvas = 'deep'; return e.canvas; }   // open ocean
    queue.push(() => buildTile(z, tx, ty, C).then(c => { e.canvas = c; draw(); }, () => { e.failed = true; }));
    pump();
    if (cache.size > 90) { const old = cache.keys().next().value; cache.delete(old); }
  }
  return e.canvas;
}
// tiles are painted one after another, so the screen stays responsive while new ones arrive
const queue = []; let busy = false;
function pump() { if (busy || !queue.length) return; busy = true; const job = queue.pop(); job().finally(() => { busy = false; setTimeout(pump, 0); }); }

const smooth = (a, b, v) => Math.min(1, Math.max(0, (v - a) / (b - a)));
function draw() {
  if (!world) return;
  const dpr = devicePixelRatio, sw = cv.width, sh = cv.height, s = view.z * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // zoom level: full resolution (4) when close, coarser tiles when far
  const z = Math.max(0, Math.min(ZMAX, Math.round(3 + Math.log2(view.z) + 0.25)));
  const f = 2 ** (3 - z);                     // world px per tile px
  const tsz = T * f * s;                      // one tile's size on screen
  const C = Math.max(256, Math.min(view.z > 4 ? 2048 : 1024, 2 ** Math.ceil(Math.log2(tsz) - 0.1)));   // paint at or above screen size: always crisp   // paint resolution: ground texture stays crisp
  const k = tsz / C;                          // screen px per painted px
  // open ocean: deep-sea ripples, locked to the same painted-pixel grid as the tiles
  if (deepPat) {
    const P = 512 * k, mod = (v) => ((v % P) + P) % P;
    deepPat.setTransform(new DOMMatrix([k, 0, 0, k, mod(-view.x * s + sw / 2), mod(-view.y * s + sh / 2)]));
    ctx.fillStyle = deepPat;
  } else ctx.fillStyle = `rgb(${SEA.deep})`;
  ctx.fillRect(0, 0, sw, sh);
  const x0 = view.x - sw / 2 / s, y0 = view.y - sh / 2 / s, x1 = view.x + sw / 2 / s, y1 = view.y + sh / 2 / s;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  for (let ty = Math.max(0, Math.floor(y0 / (T * f))); ty * T * f < Math.min(H, y1); ty++)
    for (let tx = Math.max(0, Math.floor(x0 / (T * f))); tx * T * f < Math.min(W, x1); tx++) {
      let c = tileFor(z, tx, ty, C), sx = 0, sy = 0, sz = null;
      if (c === 'deep') continue;
      if (!c) {   // while it paints: the same tile at another resolution, or the coarser parent, so there are no holes
        for (const C2 of [512, 1024, 2048, 256]) { const e = cache.get(`${gen}/${C2}/${z}/${tx}/${ty}`); if (e?.canvas && e.canvas !== 'deep') { c = e.canvas; break; } }
        if (!c && z > 0) for (const C2 of [C, 512, 1024, 256]) {
          const e = cache.get(`${gen}/${C2}/${z - 1}/${tx >> 1}/${ty >> 1}`);
          if (e?.canvas && e.canvas !== 'deep') { c = e.canvas; sz = C2 / 2; sx = (tx & 1) * sz; sy = (ty & 1) * sz; break; }
        }
      }
      if (!c) continue;
      const px = (tx * T * f - view.x) * s + sw / 2, py = (ty * T * f - view.y) * s + sh / 2;
      const X0 = Math.round(px), Y0 = Math.round(py), X1 = Math.round(px + tsz), Y1 = Math.round(py + tsz);   // whole pixels: no hairlines
      if (sz) ctx.drawImage(c, sx, sy, sz, sz, X0, Y0, X1 - X0, Y1 - Y0);
      else ctx.drawImage(c, X0, Y0, X1 - X0, Y1 - Y0);
    }
  drawCities(s, sw, sh);
  drawBorders(s, sw, sh);
  const countryBoxes = drawCountryNames(s, sw, sh) || [];
  // drawArmies(s, sw, sh, performance.now());   // paused until the ground is right
  // cities: most important first; a label that would overlap one already placed (or a country name) is skipped
  ctx.textAlign = 'center';
  const placed = countryBoxes.slice();
  for (const p of cityOrder) {
    // when names appear: big playable capitals first, small and computer-run countries only closer in
    const big = p.area >= 300000;
    const capAt = p.cls === 'neutral' ? 1.4 : 1.0;                                // cities speak from country zoom in; quick, clean switch
    const show = p.kind === 'capital' ? smooth(capAt, capAt + 0.08, view.z) : p.kind === 'major' ? smooth(1.0, 1.08, view.z) : smooth(1.35, 1.45, view.z);
    if (!show) continue;
    const sx = (p.x - view.x) * s + sw / 2, sy = (p.y - view.y) * s + sh / 2;
    if (sx < -100 || sy < -50 || sx > sw + 100 || sy > sh + 50) continue;
    const fs = ((p.kind === 'capital' ? 16 : p.kind === 'major' ? 15 : 14) + 7 * smooth(1.1, 4, view.z)) * dpr;   // CoN: 35 px growing to 55 px on a 1080-px screen
    ctx.font = p.kind === 'capital' ? `700 ${fs}px Plex, system-ui` : `500 ${fs}px Plex, system-ui`;
    const tw = ctx.measureText(p.name_ar).width;
    // one rule for every name: centred right under its city (under the marker far away, under the town close up).
    // Only if that spot is taken may it sit beside the marker, right or left, level with it. Otherwise it waits.
    const fadeM = 1 - smooth(0.8, 1.25, view.z), near = smooth(1.25, 1.8, view.z);
    const below = Math.max(fs * 0.4, (p.kind === 'capital' ? markSize(p) * 0.42 : p.r * s * 0.55 * smooth(0.9, 1.1, view.z)) + fs * 0.85);
    const spots = [[0, below, 'center']];
    if (p.kind === 'capital') spots.push([-(tw / 2 + 10 * dpr), fs * 0.35, 'left'], [tw / 2 + 10 * dpr, fs * 0.35, 'right']);   // a capital is never dropped: it may sit beside its city
    
    let spot = null;
    for (const [dx, dy] of spots) {
      const cx = sx + dx, by = sy + dy, box = [cx - tw / 2 - 3 * dpr, by - fs * 0.95, cx + tw / 2 + 3 * dpr, by + fs * 0.35];
      if (dx && (box[0] < 0 || box[2] > sw)) continue;
      const pad = 10 * dpr;
      if (placed.some(b => box[0] - pad < b[2] && box[2] + pad > b[0] && box[1] - pad < b[3] && box[3] + pad > b[1])) continue;
      placed.push(box); spot = [cx, by]; break;
    }
    if (!spot) continue;
    ctx.globalAlpha = show;
    // (city markers: rendered skyline miniatures come next; no stuck-on symbols)
    // our own lettering: warm white, a thin dark edge and a short soft shadow
    const lx = Math.round(spot[0]), ly = Math.round(spot[1]);
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2, fs * 0.16); ctx.strokeStyle = 'rgba(6,10,14,0.9)';
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 4 * dpr; ctx.shadowOffsetY = 1.5 * dpr;
    ctx.strokeText(p.name_ar, lx, ly);
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.fillStyle = '#F3EFE4'; ctx.fillText(p.name_ar, lx, ly);
  }
  ctx.globalAlpha = 1;
  document.getElementById('hud').textContent = `zoom ${view.z.toFixed(2)} · tiles z${z}`;
}



// ---------- markers ----------
const REL_COL = {me: '#9BC96B', ally: '#D2DCA6', passage: '#5E9A5A', neutral: '#A9B1BA', enemy: '#E0522A'};
function star(g, r, fill) {                      // eight-pointed star: two squares, one turned 45 degrees
  g.beginPath();
  for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8 - Math.PI / 2, rr = k % 2 ? r * 0.62 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  g.closePath(); g.lineJoin = 'miter'; g.lineWidth = r * 0.3; g.strokeStyle = '#070B11'; g.stroke(); g.fillStyle = fill; g.fill();
}
function pip(g, rel, r) {
  g.beginPath();
  if (rel === 'enemy') { g.moveTo(0, -r * 1.25); g.lineTo(r * 1.25, 0); g.lineTo(0, r * 1.25); g.lineTo(-r * 1.25, 0); g.closePath(); }
  else if (rel === 'neutral') g.rect(-r, -r, 2 * r, 2 * r);
  else g.rect(-r * 1.35, -r * 0.85, 2.7 * r, 1.7 * r);
  g.lineWidth = r * 0.45; g.strokeStyle = '#070B11'; g.stroke(); g.fillStyle = REL_COL[rel] || '#A9B1BA'; g.fill();
}

// ---------- country names: big, printed on the land at world zoom ----------
let countryLabels = [];
function drawCountryNames(s, sw, sh) {

window.mapView = (x, y, z) => { view = {x, y, z}; draw(); };
window.setRelations = (me, rel) => { ME = me; REL = rel; gen++; cache.clear(); draw(); };
window.tilesPending = () => [...cache.values()].filter(e => !e.canvas && !e.failed).length;
window.world_ = () => world;

const bbox = p => { let a = 1e9, c = 1e9, d = -1e9, e = -1e9; for (let i = 0; i < p.length; i += 2) { a = Math.min(a, p[i]); d = Math.max(d, p[i]); c = Math.min(c, p[i + 1]); e = Math.max(e, p[i + 1]); } return [a, c, d, e]; };
fetch(DATA + 'province_lines.json').then(r => r.ok ? r.json() : []).then(ls => { provLines = ls.map(p => ({p, bb: bbox(p)})); draw(); }, () => 0);
fetch(DATA + 'borders.json').then(r => r.ok ? r.json() : []).then(bs => {
  borders = bs.map(b => { let a = 1e9, c = 1e9, d = -1e9, e = -1e9; for (let i = 0; i < b.p.length; i += 2) { a = Math.min(a, b.p[i]); d = Math.max(d, b.p[i]); c = Math.min(c, b.p[i + 1]); e = Math.max(e, b.p[i + 1]); } return {...b, bb: [a, c, d, e]}; });
  draw();
}, () => 0);
fetch(DATA + 'world.json').then(r => r.json()).then(async j => {
  try { const m = await (await fetch(DATA + 'tiles/tiles.json')).json(); manifest = {}; for (const k in m) manifest[k] = new Set(m[k]); ZMAX = Math.max(...Object.keys(m).map(Number)); } catch (e) {}
  world = j; [W, H] = j.size; countries = j.countries; countries.forEach(c => byIso[c.iso] = c);
  const rank = {capital: 0, major: 1, minor: 2};
  const crank = {playable: 0, ai: 1, neutral: 2};
  // country name anchor: area-weighted centre of its provinces, but never in the sea between islands
  const byC = {};
  for (const pr of j.provinces) (byC[pr.country] = byC[pr.country] || []).push(pr);
  countryLabels = countries.map(c => {
    const ps = byC[c.iso] || []; if (!ps.length) return null;
    const tot = ps.reduce((a, p) => a + p.px, 0);
    let x = ps.reduce((a, p) => a + p.centre[0] * p.px, 0) / tot, y = ps.reduce((a, p) => a + p.centre[1] * p.px, 0) / tot;
    const best = ps.reduce((b, p) => (Math.hypot(p.centre[0] - x, p.centre[1] - y) / Math.sqrt(p.px) < Math.hypot(b.centre[0] - x, b.centre[1] - y) / Math.sqrt(b.px) ? p : b), ps[0]);
    if (ps.length > 1 && Math.hypot(best.centre[0] - x, best.centre[1] - y) > Math.sqrt(best.px) * 0.8) { x = best.centre[0]; y = best.centre[1]; }
    return {name: c.name_ar, iso: c.iso, x, y, px: tot};
  }).filter(Boolean).sort((a, b) => b.px - a.px);
  // each city's size: by importance, but never crowding its neighbours, and smaller in small countries,
  // so Jordan or Lebanon keep open land between their towns
  const allC = countries.flatMap(c => (c.cities || []).map(p => [p, c]));
  for (const [p, c] of allC) {
    let dmin = 1e9;
    for (const [q] of allC) if (q !== p) dmin = Math.min(dmin, Math.hypot(q.x - p.x, q.y - p.y));
    const fc = Math.min(1, Math.max(0.5, Math.sqrt(c.area_km2 || 1e5) / 550));
    p.r = Math.max(4, Math.min(CR[p.kind] * fc, dmin * 0.36));
  }
  cityOrder = countries.flatMap((c, ci) => (c.cities || []).map(p => ({...p, ci, area: c.area_km2, cls: c.class})))
    .sort((a, b) => rank[a.kind] - rank[b.kind] || crank[a.cls] - crank[b.cls] || b.area - a.area || b.pop - a.pop);
  setupArmies();
  const cap = (byIso[ME].cities || [])[0] || {x: W / 2, y: H / 2};
  view = {x: cap.x, y: cap.y, z: 0.5};
  addEventListener('resize', resize); resize();
  Promise.all([document.fonts.load('500 14px Plex', 'عمان'), document.fonts.load('700 14px Plex', 'عمان')]).then(() => { draw(); document.title = 'World ready'; });
});
</script>
