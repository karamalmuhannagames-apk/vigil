plugins { id 'com.android.application' }
def vCode = (System.getenv('VERSION_CODE') ?: '1') as Integer
android {
    namespace 'com.vigil.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.vigil.game'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName "0.1.${vCode}"
    }
    signingConfigs {
        // The key never lives in the repository: CI writes it from a secret, or makes a throwaway one.
        fixed {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: '../vigil.keystore')
            storePassword System.getenv('KEYSTORE_PASS') ?: 'android'
            keyAlias System.getenv('KEY_ALIAS') ?: 'vigil'
            keyPassword System.getenv('KEYSTORE_PASS') ?: 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.fixed }
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
